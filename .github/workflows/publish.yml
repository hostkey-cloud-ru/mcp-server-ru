name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write # OIDC для npm Trusted Publishing (provenance)
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Не ставить registry-url: иначе .npmrc с NODE_AUTH_TOKEN и npm
      # пропускает OIDC Trusted Publishing (403 OIDC permission denied).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run build
      # NPM_TOKEN не нужен: Trusted Publishing (OIDC).
      # npmjs.com → package → Trusted Publisher → GitHub Actions →
      # repo + workflow Publish (.github/workflows/publish.yml).
      - run: npm publish --provenance --access public

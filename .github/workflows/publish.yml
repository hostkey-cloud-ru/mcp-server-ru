name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      registry_only:
        description: "Пропустить npm; только server.json → MCP Registry (после ручного npm publish)"
        type: boolean
        default: false

permissions:
  id-token: write # OIDC для npm Trusted Publishing + mcp-publisher github-oidc
  contents: read

jobs:
  npm:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.registry_only == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Node 24 + свежий npm (>= 11.5.1) нужны для Trusted Publishing / OIDC.
      # registry-url — по актуальной доке npm; с id-token: write CLI берёт OIDC,
      # секреты NPM_TOKEN / NODE_AUTH_TOKEN не нужны.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Ensure npm CLI supports Trusted Publishing
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck && npm run build

      # Без NPM_TOKEN. Сначала Trusted Publisher на npmjs.com:
      # package → Settings → Trusted Publisher → GitHub Actions
      #   Organization: hostkey-cloud-ru
      #   Repository: mcp-server-ru
      #   Workflow filename: publish.yml
      #   Allowed actions: включить "npm publish" (не только stage)
      - run: npm publish --access public --provenance

  mcp-registry:
    # После npm (release) или отдельно: Actions → Publish → registry_only.
    # Registry сверяет packages[].version с уже опубликованным npm.
    needs: npm
    if: |
      always() && (
        needs.npm.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.registry_only == true)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Wait until npm serves this version
        run: |
          set -euo pipefail
          PKG=$(jq -r '.packages[0].identifier' server.json)
          VER=$(jq -r '.version' server.json)
          echo "Waiting for $PKG@$VER on npm…"
          for i in $(seq 1 90); do
            if npm view "$PKG@$VER" version >/dev/null 2>&1; then
              echo "Found $PKG@$VER"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$PKG@$VER not visible on npm after ~15m"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      # io.github.<owner>/<repo> → GitHub OIDC, без PAT.
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to MCP Registry
        run: |
          set -euo pipefail
          NAME=$(jq -r '.name' server.json)
          VER=$(jq -r '.version' server.json)
          ENC=$(printf '%s' "$NAME" | jq -sRr @uri)
          CODE=$(curl -sS -o /tmp/reg.json -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${ENC}/versions/${VER}" || true)
          if [ "$CODE" = "200" ]; then
            echo "Already published: $NAME@$VER — skipping"
            exit 0
          fi
          set +e
          OUT=$(./mcp-publisher publish 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          if [ $STATUS -eq 0 ]; then
            exit 0
          fi
          # Идемпотентные повторные прогоны (registry_only после успешного publish).
          if echo "$OUT" | grep -qi 'duplicate version'; then
            echo "Version already on registry — treating as success"
            exit 0
          fi
          exit $STATUS
